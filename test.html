<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - For You, Chany</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .test-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 50px;
            border-radius: 20px;
        }
        input, button {
            padding: 10px;
            margin: 10px;
            border: none;
            border-radius: 5px;
        }
        button {
            background: #ff6b6b;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Test Version - For You, Chany 💖</h1>
        <p>Enter code: 354262</p>
        <input type="password" id="codeInput" placeholder="Enter code">
        <button onclick="testLogin()">Test Login</button>
        <div id="result" style="margin-top: 20px;"></div>
    </div>

    <script>
        function testLogin() {
            const code = document.getElementById('codeInput').value;
            const result = document.getElementById('result');
            
            if (code === '354262') {
                result.innerHTML = '<h2>✅ SUCCESS!</h2><p>Your main website should work fine.</p><p>The issue might be with external resources loading.</p>';
                result.style.color = '#4CAF50';
            } else {
                result.innerHTML = '<h2>❌ Wrong Code</h2><p>Try: 354262</p>';
                result.style.color = '#ff6b6b';
            }
        }
        
        // Test if basic JavaScript works
        console.log('Test page loaded successfully!');
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded - JavaScript is working!');
        });
    </script>
</body>
</html>
